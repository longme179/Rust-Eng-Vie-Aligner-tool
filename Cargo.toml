[package]
name = "en-vi-align-rust"
version = "2.10.1"
edition = "2021"
description = "REVA tool — ghép & sắp đoạn văn bản Anh–Việt (tiền thân: Cánh đôi Anh–Việt), chạy 100% cục bộ"
license = "MIT"

[[bin]]
name = "reva-tool"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
unicode-normalization = "0.1"
rust_xlsxwriter = "0.99.1"
zip = { version = "8", features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
